name: App (Android + iOS)

on:
  push:
    branches: [main]
    paths: ["app/TacReports/**", ".github/workflows/app.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app/TacReports

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared logic tests
        run: ./gradlew :shared:testDebugUnitTest
      # APK for the phone link, AAB (app bundle) for Google Play; both signed with the upload key.
      - name: Build APK and AAB
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::warning::Signing secrets are not set; this build is signed with the DEBUG key (Play will reject the AAB)."
          fi
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk TacReports.apk
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab TacReports.aab
      - uses: actions/upload-artifact@v4
        with:
          name: TacReports-android-${{ github.sha }}
          path: |
            app/TacReports/TacReports.apk
            app/TacReports/TacReports.aab
      # Fixed, login-free links:
      # https://github.com/MantasR/TacReports/releases/download/android-latest/TacReports.apk (phone)
      # https://github.com/MantasR/TacReports/releases/download/android-latest/TacReports.aab (Play Console upload)
      - name: Publish download links
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TacReports.apk TacReports.aab --prerelease --target "$GITHUB_SHA" \
            --title "TacReports Android (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}, version code $((100 + GITHUB_RUN_NUMBER)). On the phone: download TacReports.apk and install it. For Google Play: upload TacReports.aab in Play Console."

  # Compiles the iOS app for the simulator (unsigned): proves the shared code and the Swift shell build.
  # An installable iPhone build needs an Apple Developer account and signing secrets on top of this.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Failures are repeated as one annotation, readable without opening the (login-only) log.
      - name: Shared logic tests on iOS
        run: |
          ./gradlew :shared:iosSimulatorArm64Test > gradle.log 2>&1 || {
            cat gradle.log
            echo "::error title=iOS Kotlin build::$(grep -E '^e: |What went wrong|FAILED|Caused by' -A2 gradle.log | head -40 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')"
            exit 1
          }
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen
      - name: Build for simulator
        run: |
          xcodebuild -project iosApp/TacReports.xcodeproj -scheme TacReports \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > xcode.log 2>&1 || {
            cat xcode.log
            echo "::error title=Xcode build::$(grep -E 'error:|BUILD FAILED' xcode.log | sort -u | head -30 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')"
            exit 1
          }
