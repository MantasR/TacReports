name: App (Android + iOS)

on:
  push:
    branches: [main]
    paths: ["app/TacReports/**", ".github/workflows/app.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app/TacReports

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared logic tests
        run: ./gradlew :shared:testDebugUnitTest
      - name: Build APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::warning::Signing secrets are not set; this APK is signed with the DEBUG key."
          fi
          ./gradlew :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TacReports-android-${{ github.sha }}
          path: app/TacReports/androidApp/build/outputs/apk/release/androidApp-release.apk
      # A fixed, login-free link for the phone:
      # https://github.com/MantasR/TacReports/releases/download/android-latest/TacReports.apk
      - name: Publish phone download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk TacReports.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TacReports.apk --prerelease --target "$GITHUB_SHA" \
            --title "TacReports Android (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Open on the phone, download TacReports.apk and install it."

  # Compiles the iOS app for the simulator (unsigned): proves the shared code and the Swift shell build.
  # An installable iPhone build needs an Apple Developer account and signing secrets on top of this.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared logic tests on iOS
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen
      - name: Build for simulator
        run: |
          xcodebuild -project iosApp/TacReports.xcodeproj -scheme TacReports \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
